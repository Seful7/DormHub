<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>DormHub V3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f7;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:0.6!important;cursor:not-allowed!important;pointer-events:none!important}
.app{max-width:520px;margin:auto;min-height:100vh;background:#f8fafc;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:15;background:#111827;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:15px;margin:0 0 4px}
.small{font-size:12px;color:#9ca3af}
.header-actions{display:flex;gap:8px;align-items:center}
.content{padding:16px 16px 92px;flex:1}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px #00000006}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.muted{color:#6b7280;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px}
.btn{border:0;border-radius:11px;padding:10px 14px;background:#111827;color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.secondary{background:#e5e7eb;color:#111827}
.btn.green{background:#16a34a}
.btn.red{background:#dc2626}
.btn.blue{background:#2563eb}
.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#e0e7ff;color:#3730a3}
.badge.done{background:#dcfce7;color:#166534}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.danger{background:#fee2e2;color:#991b1b}
.task{display:flex;gap:12px;align-items:flex-start}
.icon{font-size:26px}
.task-main{flex:1}
.task p{margin:2px 0;color:#6b7280;font-size:13px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid #e5e7eb;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:#fff;color:#6b7280;padding:8px 2px;font-size:10px}
.nav button.active{color:#111827;font-weight:800}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:11px;background:#fff;margin:5px 0 10px;outline:none;font-size:14px}
textarea{resize:vertical}
label{font-size:12px;font-weight:700;color:#374151}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:30}
.modal.show{display:flex}
.sheet{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px;margin:auto 0 0}
.login{min-height:100vh;display:flex;align-items:center;padding:20px}
.loginbox{width:100%}
.notice{background:#eff6ff;color:#1e40af;padding:12px;border-radius:12px;font-size:13px;margin:12px 0}
.empty{text-align:center;color:#6b7280;padding:22px}
.dangerText{color:#b91c1c}
.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:#111827}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* Чат стили */
.chat-box{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.chat-msg{max-width:85%;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid #e5e7eb;box-shadow:0 1px 3px #00000005}
.chat-msg.mine{align-self:flex-end;background:#dbeafe;border-color:#bfdbfe}
.chat-msg.other{align-self:flex-start}
.chat-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#6b7280;margin-bottom:4px;gap:8px}
.chat-body{font-size:14px;white-space:pre-wrap;word-break:break-word}
.chat-form{display:flex;gap:8px;position:sticky;bottom:0;background:#f8fafc;padding-top:6px}
.chat-form input{margin:0;flex:1}

/* Фильтры */
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.filter-btn{padding:6px 12px;border-radius:99px;border:1px solid #d1d5db;background:#fff;font-size:12px;white-weight:600;white-space:nowrap}
.filter-btn.active{background:#111827;color:#fff;border-color:#111827}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bpseqlkfsdpegapsxrwv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2MVUg0ZgAzobxVlQ83Tf5w_v82atyNx";
const ONLINE = true;
const sb = ONLINE ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let user = null, profile = null, page = "home", demo = !ONLINE;
let taskFilter = "all";
let isSubmitting = false;

let db = { users:[], tasks:[], problems:[], expenses:[], inventory:[], announcements:[], notifications:[], chat:[] };

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const money = n => Number(n||0).toLocaleString("ru-KZ")+" ₸";
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random();

// Блокировка повторных нажатий
async function runAsync(btn, fn) {
  if (isSubmitting) return;
  isSubmitting = true;
  let originalContent = "";
  if (btn) {
    btn.disabled = true;
    originalContent = btn.innerHTML;
    btn.innerHTML = "⏳ Обработка...";
  }
  try {
    await fn();
  } catch (err) {
    alert("Ошибка: " + (err.message || err));
  } finally {
    isSubmitting = false;
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = originalContent;
    }
  }
}

function demoData() {
  db.users = [
    {id:"admin",name:"Сефул",room:"A",role:"admin"},
    {id:"u2",name:"User 2",room:"A",role:"member"},
    {id:"u3",name:"User 3",room:"B",role:"member"},
    {id:"u4",name:"User 4",room:"B",role:"member"},
    {id:"u5",name:"User 5",room:"B",role:"member"}
  ];
  db.tasks = [
    {id:uid(),title:"Вынести мусор",location:"Коридор",user_id:"admin",created_by:"admin",due_date:today(),points:1,status:"pending",icon:"🗑"},
    {id:uid(),title:"Уборка туалета",location:"Туалет",user_id:"u3",created_by:"admin",due_date:today(),points:3,status:"done",icon:"🚽"}
  ];
  db.problems = [{id:uid(),title:"Пример проблемы",location:"Раковина",description:"Демо-запись",status:"new",reporter_id:"u4",created_at:new Date().toISOString()}];
  db.expenses = [{id:uid(),title:"Мусорные пакеты",amount:1200,user_id:"u2",user_name:"User 2",created_at:new Date().toISOString()}];
  db.inventory = [{id:uid(),name:"Туалетная бумага",quantity:6,unit:"рулонов",low_threshold:2}];
  db.announcements = [{id:uid(),title:"Добро пожаловать в DormHub V3",body:"Добавлен чат и удаление проблем/расходов!",created_at:new Date().toISOString()}];
  db.chat = [{id:uid(),user_id:"admin",message:"Всем привет в новом чате DormHub! 👋",created_at:new Date().toISOString()}];
  db.notifications = [];
  user = {id:"admin"}; profile = db.users[0];
}

async function init() {
  if (demo) { demoData(); render(); return; }
  const {data:{session}} = await sb.auth.getSession();
  if (session) {
    user = session.user;
    await load();
    render();
  } else {
    loginScreen();
  }
  sb.auth.onAuthStateChange(async (_, s) => {
    if (s) { user = s.user; await load(); render(); }
  });
}

async function load() {
  if (demo) return;
  const fetchAll = async (table, queryFn) => {
    let q = sb.from(table).select("*");
    if (queryFn) q = queryFn(q);
    const r = await q;
    return r.data || [];
  };

  const p = await sb.from("profiles").select("*").eq("id", user.id).single();
  profile = p.data;

  db.users = await fetchAll("profiles");
  db.problems = await fetchAll("problems");
  db.expenses = await fetchAll("expenses");
  db.inventory = await fetchAll("inventory");
  db.announcements = await fetchAll("announcements");
  db.chat = await fetchAll("chat_messages", q => q.order("created_at", {ascending: true}));
  db.tasks = await fetchAll("task_assignments");
  db.notifications = await fetchAll("notifications", q => q.eq("user_id", user.id).order("created_at", {ascending: false}));
}

function loginScreen() {
  $("root").innerHTML = `
    <div class="login">
      <div class="loginbox">
        <h1>🏠 DormHub V3</h1>
        <p class="muted">Общий портал вашей общежития</p>
        <div class="card">
          <label>Email</label>
          <input id="email" type="email" placeholder="you@example.com">
          <label>Пароль</label>
          <input id="password" type="password" placeholder="••••••••">
          <button class="btn" style="width:100%" onclick="runAsync(this, login)">Войти</button>
        </div>
      </div>
    </div>`;
}

async function login() {
  const r = await sb.auth.signInWithPassword({email:$("email").value, password:$("password").value});
  if (r.error) alert(r.error.message);
}

async function logout() {
  if (demo) { demoData(); render(); return; }
  await sb.auth.signOut();
  location.reload();
}

function render() {
  const admin = profile?.role === "admin";
  $("root").innerHTML = `
    <div class="app">
      <header>
        <div>
          <h1>🏠 DormHub V3</h1>
          <div class="small">${esc(profile?.name||"Пользователь")} · ${admin?"👑 Admin":"Member"}</div>
        </div>
        <div class="header-actions">
          <button class="btn secondary small" onclick="refreshData(this)">🔄</button>
          <button class="btn secondary small" onclick="logout()">Выйти</button>
        </div>
      </header>
      <main class="content" id="page"></main>
      <nav class="nav">
        <button class="${page==="home"?"active":""}" onclick="go('home')">🏠<br>Главная</button>
        <button class="${page==="tasks"?"active":""}" onclick="go('tasks')">📋<br>Задачи</button>
        <button class="${page==="chat"?"active":""}" onclick="go('chat')">💬<br>Чат</button>
        <button class="${page==="problems"?"active":""}" onclick="go('problems')">🚨<br>Проблемы</button>
        <button class="${page==="money"?"active":""}" onclick="go('money')">💰<br>Расходы</button>
        <button class="${page==="admin"?"active":""}" onclick="go('${admin?"admin":"more"}')">${admin?"👑":"•••"}<br>${admin?"Админ":"Ещё"}</button>
      </nav>
    </div>`;
  draw();
}

function go(p) { page = p; render(); }
async function refreshData(btn) {
  await runAsync(btn, async () => {
    await load();
    render();
  });
}

function draw() {
  let e = $("page");
  if (page === "home") home(e);
  else if (page === "tasks") tasks(e);
  else if (page === "chat") chatPage(e);
  else if (page === "problems") problems(e);
  else if (page === "money") moneyPage(e);
  else if (page === "admin") admin(e);
  else more(e);
}

function empty(s) { return `<div class="card empty">${s}</div>`; }

/* ТАСКИ */
function taskCard(t, admin = false) {
  const done = t.status === "done";
  const who = db.users.find(u => u.id === t.user_id)?.name || "Неизвестно";
  const creator = db.users.find(u => u.id === t.created_by)?.name || "—";
  const canDelete = admin || t.created_by === user.id;

  return `
    <div class="card task">
      <div class="icon">${t.icon||"🧹"}</div>
      <div class="task-main">
        <h3>${esc(t.title)}</h3>
        <p>📍 ${esc(t.location||"Общая зона")}</p>
        <p>📅 ${esc(t.due_date||"")} · ${t.points||1} балл(а)</p>
        <p>👤 Исполнитель: <b>${esc(who)}</b></p>
        <p>🧑‍💻 Создал: ${esc(creator)}</p>
      </div>
      <div>
        ${done 
          ? `<span class="badge done">✓ Готово</span>` 
          : `<button class="btn green small" onclick="runAsync(this, ()=>completeTask('${t.id}'))">✓ Готово</button>`}
      </div>
    </div>
    ${canDelete ? `<div class="actions" style="margin-bottom:12px"><button class="btn red small" onclick="runAsync(this, ()=>deleteTask('${t.id}'))">🗑 Удалить</button></div>` : ""}`;
}

function home(e) {
  const mine = db.tasks.filter(t => t.user_id === user.id);
  const open = mine.filter(t => t.status !== "done").length;
  const done = mine.filter(t => t.status === "done").length;

  e.innerHTML = `
    <h2>Сегодня 👋</h2>
    <div class="grid">
      <div class="stat"><b>${open}</b><span class="muted">активных задач</span></div>
      <div class="stat"><b>${done}</b><span class="muted">выполнено</span></div>
    </div>
    <h2 style="margin-top:22px">Мои ближайшие задачи</h2>
    ${mine.slice(0,5).map(t => taskCard(t)).join("") || empty("Задач нет 🎉")}
    <h2 style="margin-top:22px">📢 Объявления</h2>
    ${db.announcements.slice().reverse().slice(0,3).map(a => `
      <div class="card">
        <b>${esc(a.title)}</b>
        <p>${esc(a.body)}</p>
        <span class="muted">${esc((a.created_at||"").slice(0,10))}</span>
      </div>`).join("") || empty("Нет объявлений")}`;
}

function tasks(e) {
  const admin = profile.role === "admin";
  let list = db.tasks;

  if (taskFilter === "mine") list = list.filter(t => t.user_id === user.id || t.created_by === user.id);
  else if (taskFilter === "pending") list = list.filter(t => t.status !== "done");
  else if (taskFilter === "done") list = list.filter(t => t.status === "done");

  e.innerHTML = `
    <div class="row">
      <h2>📋 Задачи</h2>
      <button class="btn" onclick="taskModal()">+ Задача</button>
    </div>
    <div class="filter-bar">
      <button class="filter-btn ${taskFilter==="all"?"active":""}" onclick="setFilter('all')">Все (${db.tasks.length})</button>
      <button class="filter-btn ${taskFilter==="mine"?"active":""}" onclick="setFilter('mine')">Мои</button>
      <button class="filter-btn ${taskFilter==="pending"?"active":""}" onclick="setFilter('pending')">В работе</button>
      <button class="filter-btn ${taskFilter==="done"?"active":""}" onclick="setFilter('done')">Выполнено</button>
    </div>
    ${list.map(t => taskCard(t, admin)).join("") || empty("Задач не найдено")}`;
}

function setFilter(f) { taskFilter = f; render(); }

async function completeTask(id) {
  if (demo) {
    let t = db.tasks.find(x => x.id === id);
    if (t) t.status = "done";
    render(); return;
  }
  const r = await sb.from("task_assignments").update({status:"done", completed_at:new Date().toISOString()}).eq("id", id);
  if (r.error) alert(r.error.message);
  else { await load(); render(); }
}

async function deleteTask(id) {
  if (!confirm("Удалить эту задачу?")) return;
  if (demo) {
    db.tasks = db.tasks.filter(t => t.id !== id);
    render(); return;
  }
  const r = await sb.from("task_assignments").delete().eq("id", id);
  if (r.error) alert(r.error.message);
  else { await load(); render(); }
}

/* ЧАТ */
function chatPage(e) {
  const admin = profile.role === "admin";
  e.innerHTML = `
    <h2>💬 Общий чат</h2>
    <div class="chat-box" id="chatBox">
      ${db.chat.map(m => {
        const u = db.users.find(x => x.id === m.user_id);
        const isMine = m.user_id === user.id;
        const canDel = isMine || admin;
        const time = m.created_at ? new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
        return `
          <div class="chat-msg ${isMine ? 'mine' : 'other'}">
            <div class="chat-meta">
              <span><b>${esc(u?.name \vert{}\vert{} 'Житель')}</b> (${esc(u?.room || '?')})</span>
              <span>${time}${canDel ? `<a href="#" style="color:#dc2626;margin-left:4px" onclick="runAsync(this, ()=>deleteChatMessage('${m.id}'))">🗑</a>` : ''}</span>
            </div>
            <div class="chat-body">${esc(m.message)}</div>
          </div>`;
      }).join("") || empty("Сообщений пока нет. Напишите первым!")}
    </div>
    <div class="chat-form">
      <input id="chatInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') runAsync($('chatBtn'), sendChatMessage)">
      <button class="btn blue" id="chatBtn" onclick="runAsync(this, sendChatMessage)">Отправить</button>
    </div>`;

  setTimeout(() => {
    const box = $("chatBox");
    if (box) box.scrollTop = box.scrollHeight;
  }, 50);
}

async function sendChatMessage() {
  const inp = $("chatInput");
  const txt = inp ? inp.value.trim() : "";
  if (!txt) return;

  if (demo) {
    db.chat.push({id:uid(), user_id:user.id, message:txt, created_at:new Date().toISOString()});
    inp.value = "";
    render(); return;
  }

  const r = await sb.from("chat_messages").insert({user_id: user.id, message: txt});
  if (r.error) alert(r.error.message);
  else {
    inp.value = "";
    await load();
    render();
  }
}

async function deleteChatMessage(id) {
  if (!confirm("Удалить сообщение?")) return;
  if (demo) {
    db.chat = db.chat.filter(m => m.id !== id);
    render(); return;
  }
  const r = await sb.from("chat_messages").delete().eq("id", id);
  if (r.error) alert(r.error.message);
  else { await load(); render(); }
}

/* ПРОБЛЕМЫ */
function problems(e) {
  const admin = profile.role === "admin";
  e.innerHTML = `
    <div class="row">
      <h2>🚨 Проблемы</h2>
      <button class="btn" onclick="problemModal()">+ Сообщить</button>
    </div>
    ${db.problems.slice().reverse().map(p => {
      const reporter = db.users.find(u => u.id === p.reporter_id)?.name || "Житель";
      const canDelete = admin || p.reporter_id === user.id;
      return `
        <div class="card">
          <div class="row">
            <b>${esc(p.title)}</b>
            <span class="badge ${p.status==="resolved"?"done":"warn"}">${p.status==="resolved"?"Решено":"В работе"}</span>
          </div>
          <p>${esc(p.description||"")}</p>
          <p class="muted">📍 ${esc(p.location||"")} · Автор: ${esc(reporter)} ·${esc((p.created_at||"").slice(0,10))}</p>
          <div class="actions">
            ${admin && p.status!=="resolved" ? `<button class="btn green small" onclick="runAsync(this, ()=>resolveProblem('${p.id}'))">✓ Решено</button>` : ""}
            ${canDelete ? `<button class="btn red small" onclick="runAsync(this, ()=>deleteProblem('${p.id}'))">🗑 Удалить</button>` : ""}
          </div>
        </div>`;
    }).join("") || empty("Проблем нет 🎉")}`;
}

async function resolveProblem(id) {
  if (demo) {
    let p = db.problems.find(x => x.id === id);
    if (p) p.status = "resolved";
    render(); return;
  }
  const r = await sb.from("problems").update({status:"resolved"}).eq("id", id);
  if (r.error) alert(r.error.message);
  else { await load(); render(); }
}

async function deleteProblem(id) {
  if (!confirm("Удалить запись о проблеме?")) return;
  if (demo) {
    db.problems = db.problems.filter(p => p.id !== id);
    render(); return;
  }
  const r = await sb.from("problems").delete().eq("id", id);
  if (r.error) alert(r.error.message);
  else { await load(); render(); }
}

/* РАСХОДЫ */
function moneyPage(e) {
  const admin = profile.role === "admin";
  const total = db.expenses.reduce((s,x) => s + Number(x.amount||0), 0);
  const share = total / Math.max(db.users.length, 1);

  e.innerHTML = `
    <div class="row">
      <h2>💰 Расходы</h2>
      <button class="btn" onclick="expenseModal()">+ Расход</button>
    </div>
    <div class="grid">
      <div class="stat"><b>${money(total)}</b><span class="muted">всего потрачено</span></div>
      <div class="stat"><b>${money(share)}</b><span class="muted">на человека</span></div>
    </div>
    <h2 style="margin-top:18px">История трат</h2>
    ${db.expenses.slice().reverse().map(x => {
      const canDelete = admin || x.user_id === user.id;
      return `
        <div class="card">
          <div class="row">
            <b>${esc(x.title)}</b>
            <b>${money(x.amount)}</b>
          </div>
          <div class="row" style="margin-top:4px">
            <span class="muted">👤 ${esc(x.user_name\vert{}\vert{}"")} · ${(x.created_at||"").slice(0,10)}</span>
            ${canDelete ? `<button class="btn red small" onclick="runAsync(this, ()=>deleteExpense('${x.id}'))">🗑 Удалить</button>` : ""}
          </div>
        </div>`;
    }).join("") || empty("Расходов пока нет")}`;
}

async function deleteExpense(id) {
  if (!confirm("Удалить эту запись расхода?")) return;
  if (demo) {
    db.expenses = db.expenses.filter(x => x.id !== id);
    render(); return;
  }
  const r = await sb.from("expenses").delete().eq("id", id);
  if (r.error) alert(r.error.message);
  else { await load(); render(); }
}

/* АДМИН И ДРУГОЕ */
function admin(e) {
  const active = db.problems.filter(p => p.status !== "resolved").length;
  const total = db.expenses.reduce((s,x) => s + Number(x.amount||0), 0);

  e.innerHTML = `
    <h2>👑 Админ-панель</h2>
    <div class="grid">
      <div class="stat"><b>${db.users.length}</b><span class="muted">жильцов</span></div>
      <div class="stat"><b>${active}</b><span class="muted">активных проблем</span></div>
    </div>
    <div class="card">
      <h3>👥 Список жильцов</h3>
      ${db.users.map(u => `
        <div class="row" style="padding:8px 0;border-bottom:1px solid #eee">
          <span>👤 ${esc(u.name)}<br><small class="muted">Комната ${esc(u.room\vert{}\vert{}"?")} · ${u.role==="admin"?"👑 Admin":"Member"}</small></span>
        </div>`).join("")}
    </div>
    <div class="card">
      <h3>📊 Нагрузка по баллам</h3>
      ${db.users.map(u => {
        let n = db.tasks.filter(t => t.user_id === u.id).reduce((s,t) => s + (t.points||1), 0);
        return `<p class="muted">${esc(u.name)} — <b>${n}</b> баллов</p>`;
      }).join("")}
    </div>
    <div class="card">
      <h3>🧹 Быстрые действия</h3>
      <div class="actions">
        <button class="btn" onclick="taskModal()">+ Назначить задачу</button>
        <button class="btn secondary" onclick="announcementModal()">+ Объявление</button>
      </div>
    </div>`;
}

function more(e) {
  e.innerHTML = `
    <h2>••• Ещё</h2>
    <div class="card">
      <h3>📦 Запасы</h3>
      ${db.inventory.map(x => {
        let low = Number(x.quantity) <= Number(x.low_threshold);
        return `
          <div style="margin:12px 0">
            <div class="row">
              <b>${esc(x.name)}</b>
              <span class="${low?"dangerText":""}">${x.quantity}${esc(x.unit||"")}</span>
            </div>
            <div class="progress"><i style="width:${Math.min(100, Number(x.quantity)*15)}%"></i></div>
            ${low ? `<small class="dangerText">⚠️ Заканчивается</small>` : ""}
          </div>`;
      }).join("") || "Запасов нет"}
    </div>
    <div class="card">
      <h3>👤 Мой профиль</h3>
      <p>Имя: <b>${esc(profile.name)}</b></p>
      <p>Комната: <b>${esc(profile.room||"—")}</b></p>
      <p>Роль: <b>${esc(profile.role)}</b></p>
    </div>`;
}

/* МОДАЛЬНЫЕ ОКНА */
function modal(inner) {
  const m = document.createElement("div");
  m.className = "modal show";
  m.innerHTML = `<div class="sheet">${inner}<br><button class="btn secondary" style="width:100%" onclick="this.closest('.modal').remove()">Отмена</button></div>`;
  document.body.appendChild(m);
}

function taskModal() {
  modal(`
    <h2>🧹 Новая задача</h2>
    <label>Название</label>
    <input id="tt" placeholder="Например: Помыть посуду">
    <label>Место</label>
    <select id="tl">
      <option>Коридор</option>
      <option>Туалет</option>
      <option>Раковина</option>
      <option>Мусор</option>
      <option>Кухня</option>
    </select>
    <label>Исполнитель</label>
    <select id="tu">
      ${db.users.map(u => `<option value="${u.id}">${esc(u.name)} — ${esc(u.room)}${u.role==="admin"?"👑":""}</option>`).join("")}
    </select>
    <label>Дата</label>
    <input id="td" type="date" value="${today()}">
    <label>Баллы</label>
    <input id="tp" type="number" min="1" max="10" value="1">
    <button class="btn" style="width:100%" onclick="runAsync(this, createTask)">Создать задачу</button>
  `);
}

async function createTask() {
  const t = {
    title: $("tt").value,
    location: $("tl").value,
    user_id: $("tu").value,
    due_date: $("td").value,
    points: Number($("tp").value),
    status: "pending",
    icon: $("tl").value==="Туалет"?"🚽":$("tl").value==="Мусор"?"🗑":"🧹",
    created_by: user.id
  };

  if (!t.title) return alert("Введите название задачи");

  if (demo) {
    t.id = uid(); db.tasks.push(t);
  } else {
    const r = await sb.from("task_assignments").insert(t);
    if (r.error) return alert(r.error.message);
    await load();
  }
  document.querySelector(".modal").remove();
  render();
}

function problemModal() {
  modal(`
    <h2>🚨 Сообщить о проблеме</h2>
    <label>Заголовок</label>
    <input id="pt" placeholder="Сломался замок">
    <label>Место</label>
    <select id="pl">
      <option>Раковина</option>
      <option>Туалет</option>
      <option>Коридор</option>
      <option>Дверь</option>
      <option>Другое</option>
    </select>
    <label>Описание</label>
    <textarea id="pd" rows="3"></textarea>
    <button class="btn" style="width:100%" onclick="runAsync(this, createProblem)">Отправить</button>
  `);
}

async function createProblem() {
  const p = {
    id: uid(),
    title: $("pt").value,
    location: $("pl").value,
    description: $("pd").value,
    status: "new",
    reporter_id: user.id,
    created_at: new Date().toISOString()
  };

  if (!p.title) return alert("Введите заголовок");

  if (demo) {
    db.problems.push(p);
  } else {
    delete p.id;
    const r = await sb.from("problems").insert(p);
    if (r.error) return alert(r.error.message);
    await load();
  }
  document.querySelector(".modal").remove();
  render();
}

function expenseModal() {
  modal(`
    <h2>💰 Новый расход</h2>
    <label>Что купили</label>
    <input id="et" placeholder="Моющее средство">
    <label>Сумма (₸)</label>
    <input id="ea" type="number" min="0" placeholder="1500">
    <button class="btn" style="width:100%" onclick="runAsync(this, createExpense)">Добавить</button>
  `);
}

async function createExpense() {
  const x = {
    id: uid(),
    title: $("et").value,
    amount: Number($("ea").value),
    user_id: user.id,
    user_name: profile.name,
    created_at: new Date().toISOString()
  };

  if (!x.title || !x.amount) return alert("Заполните все поля");

  if (demo) {
    db.expenses.push(x);
  } else {
    delete x.id;
    const r = await sb.from("expenses").insert(x);
    if (r.error) return alert(r.error.message);
    await load();
  }
  document.querySelector(".modal").remove();
  render();
}

function announcementModal() {
  modal(`
    <h2>📢 Новое объявление</h2>
    <label>Заголовок</label>
    <input id="at" placeholder="Важное сообщение">
    <label>Текст</label>
    <textarea id="ab" rows="4"></textarea>
    <button class="btn" style="width:100%" onclick="runAsync(this, createAnnouncement)">Опубликовать</button>
  `);
}

async function createAnnouncement() {
  const x = {
    id: uid(),
    title: $("at").value,
    body: $("ab").value,
    author_id: user.id,
    created_at: new Date().toISOString()
  };

  if (!x.title) return alert("Введите заголовок");

  if (demo) {
    db.announcements.push(x);
  } else {
    delete x.id;
    const r = await sb.from("announcements").insert(x);
    if (r.error) return alert(r.error.message);
    await load();
  }
  document.querySelector(".modal").remove();
  render();
}

init();
</script>
</body>
</html>
